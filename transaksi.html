<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transaksi — Sistem Retur Toko Pakaian</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="topbar">
    <button class="hamburger" id="btnHamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <div class="topbar-title">
      <span class="brand-dot"></span>
      Sistem Retur — Toko Pakaian
    </div>
    <div class="topbar-user">Admin</div>
  </header>

    <aside class="sidebar" id="sidebar">
    <nav class="nav">
      <a href="index.html" class="nav-item">
        <span class="nav-icon">▦</span> Dashboard
      </a>
      <a href="transaksi.html" class="nav-item active">
        <span class="nav-icon">▤</span> Transaksi
      </a>
      <a href="retur.html" class="nav-item">
        <span class="nav-icon">↺</span> Retur
      </a>
      <a href="akuntansi.html" class="nav-item">
        <span class="nav-icon">∑</span> Akuntansi
      </a>
    </nav>
  </aside>
  <div class="overlay" id="overlay"></div>

  <main class="main">

    <div class="page-header">
      <h1>Transaksi Penjualan</h1>
      <p>Daftar transaksi pelanggan toko pakaian.</p>
    </div>

    <!-- TOOLBAR -->
    <section class="card toolbar">
      <input
        type="text"
        id="inputSearchTransaksi"
        class="input"
        placeholder="🔍 Cari ID transaksi atau nama pelanggan..."
      />
      <input
        type="date"
        id="filterTanggalTransaksi"
        class="input input-date"
      />
      <button class="btn btn-secondary" id="btnResetFilter">Reset</button>
    </section>

    <!-- TABEL -->
    <section class="card">
      <div class="table-wrap">
        <table class="table" id="tabelTransaksi">
          <thead>
            <tr>
              <th>ID Transaksi</th>
              <th>Pelanggan</th>
              <th>Tanggal</th>
              <th class="text-right">Total</th>
              <th class="text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="tbodyTransaksi">
            <tr><td colspan="5" class="loader">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- ============================= -->
  <!-- MODAL DETAIL TRANSAKSI -->
  <!-- ============================= -->
  <div class="modal" id="modalDetailTransaksi">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Detail Transaksi</h3>
        <button class="modal-close" data-close="modalDetailTransaksi">×</button>
      </div>
      <div class="modal-body" id="detailTransaksiBody">
        <!-- diisi JS -->
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-close="modalDetailTransaksi">Tutup</button>
        <button class="btn btn-primary" id="btnAjukanReturDariModal">Ajukan Retur</button>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast-wrap" id="toastWrap"></div>

  <script type="module" src="js/transaksi.js"></script>
</body>
</html>
